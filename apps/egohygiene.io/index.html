<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="Tools, ideas, and practices for moving toward balance and harmony."
    >
    <meta name="theme-color" content="#120d1f">
    <script>
      (() => {
        const storedTheme = localStorage.getItem("egohygiene-theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const theme =
          storedTheme && storedTheme !== "system" ? storedTheme : prefersDark ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme === "light" ? "light" : "dark";
      })();
    </script>
    <title>Ego Hygiene</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
