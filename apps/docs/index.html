<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Documentation for the Ego Hygiene website monorepo.">
    <meta name="theme-color" content="#120d1f">
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" href="%BASE_URL%favicon.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" sizes="180x180">
    <link rel="manifest" href="%BASE_URL%site.webmanifest">
    <script>
      (() => {
        const storedTheme = localStorage.getItem("egohygiene-theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme =
          storedTheme && storedTheme !== "system" ? storedTheme : prefersDark ? "dark" : "light";
      })();
    </script>
    <title>Ego Hygiene Docs</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
