<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Documentation for the Ego Hygiene website monorepo.">
    <script>
      (() => {
        const storedTheme = localStorage.getItem("egohygiene-theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme =
          storedTheme && storedTheme !== "system" ? storedTheme : prefersDark ? "dark" : "light";
      })();
    </script>
    <title>Ego Hygiene Docs</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
