version: "3"

tasks:
  default:
    desc: "List the available local storefront tasks"
    cmds:
      - task --list

  setup:store:
    desc: "Check Node, select pinned pnpm, and install locked dependencies"
    preconditions:
      - sh: "command -v node >/dev/null 2>&1"
        msg: "Node.js is missing from PATH. Install Node 24.21.0, then retry; see docs/store/local-preview.md."
    cmds:
      - node scripts/store-environment.mjs setup

  build:store:
    desc: "Set up dependencies and build a fresh, isolated local store preview"
    cmds:
      - task: setup:store
      - node scripts/store-environment.mjs run catalog:validate
      - node scripts/store-environment.mjs build

  preview:store:
    desc: "Set up, build, and open the store at http://127.0.0.1:4173/store"
    cmds:
      - task: build:store
      - node scripts/store-environment.mjs preview

  dev:store:
    desc: "Set up and open the store with live editing at http://127.0.0.1:5173/store"
    cmds:
      - task: setup:store
      - node scripts/store-environment.mjs dev

  test:store:tooling:
    desc: "Run tooling and failure-path contracts using installed dependencies"
    cmds:
      - node --test tests/tooling/*.test.mjs

  fourthwall:check:
    desc: "Check optional Fourthwall storefront credentials with read-only requests"
    cmds:
      - task: setup:store
      - node scripts/store-environment.mjs run exec node --env-file-if-exists=apps/egohygiene.io/.env.local scripts/check-fourthwall.mjs

  typecheck:all:
    desc: "Check explicit application, workspace, tooling, unit, browser, story and locale types"
    cmds:
      - node scripts/store-environment.mjs run typecheck:all

  test:unit:
    desc: "Run application and workspace unit tests"
    cmds:
      - node scripts/store-environment.mjs run test:unit

  test:semantic:
    desc: "Run DOM semantic checks; browser accessibility is separate"
    cmds:
      - node scripts/store-environment.mjs run test:semantic

  test:smoke:
    desc: "Build all three apps freshly and verify their artifacts"
    cmds:
      - node scripts/store-environment.mjs run test:smoke

  test:components:
    desc: "Build and verify the isolated stylesheet consumer"
    cmds:
      - node scripts/store-environment.mjs run test:components

  test:browser:discover:
    desc: "Check all maintained Playwright suites are selected; no browser execution"
    cmds:
      - node scripts/store-environment.mjs run test:browser:discover

  test:e2e:
    desc: "Run site, docs and playground journeys against fresh local dev servers"
    cmds:
      - node scripts/store-environment.mjs run test:e2e

  test:components:browser:
    desc: "Build fresh Storybook and standalone consumer, then run component browser checks"
    cmds:
      - node scripts/store-environment.mjs run test:components:browser

  qualify:local:
    desc: "Run the strict complete local profile, including all browser checks"
    cmds:
      - node scripts/store-environment.mjs run qualify:local

  qualify:static:
    desc: "Build a fresh local Docker image and verify context, artifacts and Caddy HTTP behavior"
    cmds:
      - node scripts/store-environment.mjs run qualify:static

  ci:check:
    desc: "Run complete non-browser validation with strict artifact and native Storybook gates"
    cmds:
      - node scripts/store-environment.mjs run ci:check

  ci:browser:
    desc: "Build fresh browser prerequisites and run all maintained browser journeys"
    cmds:
      - node scripts/store-environment.mjs run ci:browser
