name: Organization Intelligence static export
run-name: Build reviewed organization Intelligence bytes without publishing

on:
  workflow_dispatch:
    inputs:
      request_path:
        description: Repository-relative checked-in export request at this exact main revision.
        type: string
        required: true
      request_sha256:
        description: SHA-256 of the exact reviewed UTF-8 request bytes.
        type: string
        required: true
      retention_days:
        description: Ordinary review artifact lifetime, from 1 through 90 days.
        type: number
        default: 30

permissions:
  contents: read

concurrency:
  group: organization-intelligence-static-export-${{ github.repository }}
  cancel-in-progress: false

jobs:
  export:
    if: >-
      github.repository == 'egohygiene/egohygiene.io' &&
      github.event.repository.visibility == 'public' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      producer-sha: ${{ github.sha }}
      manifest-sha256: ${{ steps.export.outputs.manifest-sha256 }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Read the exact producer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Select the pinned Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: Select the pinned package manager
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
        with:
          version: 11.28.5
          run_install: false
      - name: Bind the reviewed data request
        id: request
        shell: bash
        env:
          EXPORT_REQUEST_PATH: ${{ inputs.request_path }}
          EXPORT_REQUEST_SHA256: ${{ inputs.request_sha256 }}
          EXPORT_RETENTION: ${{ inputs.retention_days }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { appendFileSync, mkdtempSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const path = process.env.EXPORT_REQUEST_PATH;
          const expected = process.env.EXPORT_REQUEST_SHA256;
          const retention = Number(process.env.EXPORT_RETENTION);
          if (!/^[A-Za-z0-9][A-Za-z0-9._/-]{0,239}$/.test(path ?? '') || path.split('/').some(part => ['', '.', '..', '.git'].includes(part))
            || !/^[a-f0-9]{64}$/.test(expected ?? '') || !Number.isSafeInteger(retention) || retention < 1 || retention > 90)
            throw new Error('Export request binding is incompatible');
          const tree = execFileSync('git', ['ls-tree', '-z', process.env.GITHUB_SHA, '--', path], { encoding: 'utf8', maxBuffer: 4096 });
          const match = /^100644 blob ([a-f0-9]{40})\t([^\0]+)\0$/.exec(tree);
          if (!match || match[2] !== path) throw new Error('Request must be a regular JSON source blob');
          const content = execFileSync('git', ['cat-file', 'blob', match[1]], { maxBuffer: 65537 });
          if (!content.length || content.length > 65536 || createHash('sha256').update(content).digest('hex') !== expected)
            throw new Error('Reviewed request bytes do not match');
          const packet = mkdtempSync(join(process.env.RUNNER_TEMP, 'intelligence-static-export-'));
          const request = join(packet, 'request.json');
          writeFileSync(request, content, { flag: 'wx' });
          appendFileSync(process.env.GITHUB_OUTPUT, `request=${request}\noutput=${join(packet, 'artifact')}\n`);
          JS
      - name: Install only the locked producer dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build the isolated Intelligence review artifact
        id: export
        shell: bash
        env:
          EXPORT_REQUEST: ${{ steps.request.outputs.request }}
          EXPORT_REQUEST_SHA256: ${{ inputs.request_sha256 }}
          EXPORT_OUTPUT: ${{ steps.request.outputs.output }}
        run: |
          set -euo pipefail
          node scripts/build-intelligence-export.mts \
            --request "${EXPORT_REQUEST}" --request-sha256 "${EXPORT_REQUEST_SHA256}" \
            --input-root "${GITHUB_WORKSPACE}" --output "${EXPORT_OUTPUT}"
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          import { appendFileSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const content = readFileSync(join(process.env.EXPORT_OUTPUT, 'export-manifest.json'));
          appendFileSync(process.env.GITHUB_OUTPUT, `manifest-sha256=${createHash('sha256').update(content).digest('hex')}\n`);
          JS
      - name: Retain exact static bytes for consumer review
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: organization-intelligence-static-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.request.outputs.output }}
          include-hidden-files: true
          if-no-files-found: error
          overwrite: false
          retention-days: ${{ inputs.retention_days }}
