name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate source, contracts, tests and builds
        run: pnpm ci:check
      - name: Install the browser and its system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Check site, docs, playground and both store artifacts
        run: pnpm ci:browser
